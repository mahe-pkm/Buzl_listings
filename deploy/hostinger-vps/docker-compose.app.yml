services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://api-listing.rclk.in
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: https://listing.rclk.in
        NEXT_PUBLIC_IS_STAGING: "true"
    environment:
      APP_ENV: "staging"
      NEXT_PUBLIC_SUPABASE_URL: https://api-listing.rclk.in
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_SITE_URL: https://listing.rclk.in
      NEXT_PUBLIC_IS_STAGING: "true"
      # Server-only: supplies the isolated Buzl service role to admin actions.
      # It is deliberately not a build argument or NEXT_PUBLIC_ variable.
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      STAGING_ADMIN_EMAIL: ${STAGING_ADMIN_EMAIL}
      STAGING_ADMIN_PASSWORD: ${STAGING_ADMIN_PASSWORD}
      STAGING_MEMBER_EMAIL: ${STAGING_MEMBER_EMAIL}
      STAGING_MEMBER_PASSWORD: ${STAGING_MEMBER_PASSWORD}
      STAGING_OWNER_EMAIL: ${STAGING_OWNER_EMAIL}
      STAGING_OWNER_PASSWORD: ${STAGING_OWNER_PASSWORD}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GOOGLE_PLACES_MOCK: "false"
    depends_on:
      kong:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default: {}
      coolify:
        aliases:
          - buzl-listing-app

  kong:
    networks:
      default: {}
      coolify:
        aliases:
          - buzl-listing-kong

networks:
  coolify:
    external: true
    name: coolify
